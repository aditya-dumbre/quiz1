<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Quiz</title>
<style>
  body {
    font-family: Arial;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    text-align: center;
  }

  h1 {
    margin-bottom: 30px;
  }

  .btn {
    display: block;
    margin: 10px;
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #7c3aed;
    color: white;
  }

  .btn:hover {
    background: #5b21b6;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Select Quiz Category</h1>

  <button class="btn" onclick="go('java')">Java</button>
  <button class="btn" onclick="go('python')">Python</button>
  <button class="btn" onclick="go('math-ai')">Math & AI</button>
  <button class="btn" onclick="go('data-analytics')">Data Analytics</button>
</div>

<script>
function go(path) {
  window.location.href = "/" + path;
}
</script>

</body>
</html>
