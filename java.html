<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiz App</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3e;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --correct: #10b981;
    --wrong: #ef4444;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --tag: #2d2d42;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,58,237,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(6,182,212,0.1) 0%, transparent 60%);
  }

  .wrapper {
    width: 100%;
    max-width: 700px;
  }

  /* ── SCREENS ── */
  .screen { display: none; animation: fadeUp 0.4s ease; }
  .screen.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── NAME SCREEN ── */
  .brand {
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent2);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 48px;
    line-height: 1.6;
  }

  .field label {
    display: block;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .field input {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 600;
    padding: 16px 20px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(124,58,237,0.15);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    padding: 16px 32px;
    cursor: pointer;
    margin-top: 24px;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 4px 24px rgba(124,58,237,0.35);
  }

  .btn:hover { background: #6d28d9; transform: translateY(-1px); box-shadow: 0 6px 32px rgba(124,58,237,0.45); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn.secondary {
    background: var(--card);
    box-shadow: none;
    border: 1.5px solid var(--border);
    color: var(--text);
  }

  .btn.secondary:hover { background: var(--tag); box-shadow: none; }

  /* ── QUIZ SCREEN ── */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
  }

  .q-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  .q-counter span { color: var(--text); font-weight: 500; }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .score-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent2);
    white-space: nowrap;
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 32px;
  }

  .q-tag {
    display: inline-block;
    background: var(--tag);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 5px 12px;
    border-radius: 99px;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .q-text {
    font-size: clamp(17px, 2.5vw, 20px);
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 28px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    font-size: 15px;
    font-weight: 600;
    text-align: left;
    width: 100%;
    color: #e8e8f0 !important;
    -webkit-text-fill-color: #e8e8f0 !important;
  }

  .opt .opt-text {
    color: #e8e8f0 !important;
    -webkit-text-fill-color: #e8e8f0 !important;
    flex: 1;
  }

  .opt:hover:not(.locked) {
    border-color: var(--accent);
    background: rgba(124,58,237,0.08);
    transform: translateX(3px);
  }

  .opt-letter {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--tag);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }

  .opt.correct {
    border-color: var(--correct);
    background: rgba(16,185,129,0.1);
  }

  .opt.correct .opt-letter {
    background: var(--correct);
    color: #fff;
  }

  .opt.wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,0.1);
  }

  .opt.wrong .opt-letter {
    background: var(--wrong);
    color: #fff;
  }

  .opt.locked { cursor: default; }

  /* ── FEEDBACK ── */
  .feedback {
    margin-top: 20px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    display: none;
    animation: fadeUp 0.3s ease;
    line-height: 1.5;
  }

  .feedback.show { display: block; }
  .feedback.correct-fb { background: rgba(16,185,129,0.12); color: #10b981 !important; -webkit-text-fill-color: #10b981 !important; border: 1px solid rgba(16,185,129,0.3); }
  .feedback.wrong-fb { background: rgba(239,68,68,0.1); color: #f87171 !important; -webkit-text-fill-color: #f87171 !important; border: 1px solid rgba(239,68,68,0.25); }

  .quiz-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 24px;
  }

  /* ── RESULT SCREEN ── */
  .result-top {
    text-align: center;
    padding: 40px 0 32px;
  }

  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--border) 0);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
    position: relative;
  }

  .score-circle::before {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    background: var(--card);
  }

  .score-inner {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .score-num {
    font-size: 28px;
    font-weight: 800;
  }

  .score-denom {
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .result-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .result-sub { color: var(--muted); font-size: 14px; }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin: 28px 0;
  }

  .stat-box {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 18px 14px;
    text-align: center;
  }

  .stat-val { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .stat-lbl { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.1em; }

  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .save-note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 16px;
  }

  .save-note.ok { color: var(--correct); }
  .save-note.err { color: var(--wrong); }
</style>
</head>
<body>
<div class="wrapper">

  <!-- NAME SCREEN -->
  <div class="screen active" id="screen-name">
    <div class="brand">◈ Quiz Portal</div>
    <h1>Test Your<br/>Knowledge</h1>
    <p class="subtitle">40 questions spanning Maths, Java, Python &amp; Statistics.<br/>Enter your name to begin.</p>
    <div class="field">
      <label>Your Name</label>
      <input type="text" id="nameInput" placeholder="e.g. Arjun Sharma" autocomplete="off" maxlength="60"/>
    </div>
    <button class="btn" id="startBtn" onclick="startQuiz()">Begin Quiz →</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="screen" id="screen-quiz">
    <div class="quiz-header">
      <div class="q-counter">Q<span id="qNum">1</span> / 40</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="score-badge" id="scoreDisplay">Score: 0</div>
    </div>
    <div class="card">
      <div class="q-tag" id="qTag">Category</div>
      <div class="q-text" id="qText">Question text</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="quiz-footer">
      <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none">Next →</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen" id="screen-result">
    <div class="result-top">
      <div class="score-circle" id="scoreCircle">
        <div class="score-inner">
          <div class="score-num" id="finalScore">0</div>
          <div class="score-denom">/ 40</div>
        </div>
      </div>
      <div class="result-title" id="resultTitle">Well done!</div>
      <div class="result-sub" id="resultSub"></div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-val" id="statCorrect" style="color:var(--correct)">0</div><div class="stat-lbl">Correct</div></div>
      <div class="stat-box"><div class="stat-val" id="statWrong" style="color:var(--wrong)">0</div><div class="stat-lbl">Wrong</div></div>
      <div class="stat-box"><div class="stat-val" id="statPct" style="color:var(--accent2)">0%</div><div class="stat-lbl">Score %</div></div>
    </div>
    <div class="result-actions">
      <button class="btn secondary" onclick="retakeQuiz()">↩ Retake</button>
      <button class="btn" onclick="saveScore()">💾 Save Score</button>
    </div>
    <div class="save-note" id="saveNote"></div>
  </div>

</div>

<script>
// ─────────────────────────── DATA ───────────────────────────
const ALL_QUESTIONS = [

{ text:"In JVM, which component optimizes bytecode into native machine code?", options:["Class Loader","Interpreter","JIT Compiler","Garbage Collector"], answer:2, cat:"Java" },
{ text:"Which access modifier allows subclass access in different package?", options:["Public","Private","Default","Protected"], answer:3, cat:"Java" },
{ text:"Which is TRUE about memory?", options:["Objects in Stack","Stack shared","Primitives in Stack","Heap smaller"], answer:2, cat:"Java" },
{ text:"Dependency Inversion Principle says?", options:["High depends low","Abstraction over details","Open for modification","Single responsibility"], answer:1, cat:"Java" },
{ text:"HashMap handles high collision by?", options:["Increase load","Balanced Tree","Rehash","Exception"], answer:1, cat:"Java" },

{ text:"Spring lifecycle after properties set?", options:["BeanFactoryPostProcessor","BeanPostProcessor","InitializingBean","DisposableBean"], answer:2, cat:"Spring" },
{ text:"Exception vs Error?", options:["Exception unchecked","Recoverable vs JVM","Error catchable","Same"], answer:1, cat:"Java" },
{ text:"Functional interface returning boolean?", options:["Function","Consumer","Supplier","Predicate"], answer:3, cat:"Java" },
{ text:"DispatcherServlet role?", options:["View","Front Controller","DB","XML config"], answer:1, cat:"Spring" },
{ text:"Reflection private field access?", options:["getField","getDeclaredField+setAccessible","getPrivateField","Not possible"], answer:1, cat:"Java" },

{ text:"Spring request scope?", options:["Prototype","Singleton","Request","Session"], answer:2, cat:"Spring" },
{ text:"Thread waiting for lock state?", options:["WAITING","TIMED_WAITING","BLOCKED","TERMINATED"], answer:2, cat:"Java" },
{ text:"Catch throws new exception then?", options:["Skip finally","Finally runs then propagate","Original thrown","Crash"], answer:1, cat:"Java" },
{ text:"Short-circuit stream op?", options:["map","filter","anyMatch","sorted"], answer:2, cat:"Java" },
{ text:"Node.js non-blocking uses?", options:["libuv threadpool","New process","JVM","Multiple V8"], answer:0, cat:"Node" },

{ text:"Date-time without zone?", options:["ZonedDateTime","Instant","LocalDateTime","OffsetDateTime"], answer:2, cat:"Java" },
{ text:"Diamond problem resolved by?", options:["Forbidden classes","Override interface","Autoboxing","Both"], answer:3, cat:"Java" },
{ text:"Not Spring characteristic?", options:["IoC","AOP","Manual memory","DI"], answer:2, cat:"Spring" },
{ text:"volatile ensures?", options:["Local cache","Atomic","Visibility","No serialization"], answer:2, cat:"Java" },
{ text:"<? super T> means?", options:["Subclass","Superclass","Exact","Any except"], answer:1, cat:"Java" },

{ text:"Spring ORM module?", options:["Core","AOP","Data/ORM","Context"], answer:2, cat:"Spring" },
{ text:"Node REPL purpose?", options:["Compile","Interactive","Manage deps","Server"], answer:1, cat:"Node" },
{ text:"Checked exception?", options:["NPE","ArrayIndex","IOException","Arithmetic"], answer:2, cat:"Java" },
{ text:"Arrays.sort uses?", options:["Quick","Merge/TimSort","Bubble","Heap"], answer:1, cat:"Java" },
{ text:"Abstract class constructor?", options:["No","Yes via subclass","Only private","Only methods"], answer:1, cat:"Java" },

{ text:"Autoboxing?", options:["Primitive→Wrapper","String→char","GC","JSON"], answer:0, cat:"Java" },
{ text:"Immutable class?", options:["No inherit","State fixed","Static only","No constructor"], answer:1, cat:"Java" },
{ text:"@Qualifier does?", options:["Component","Resolve ambiguity","Validate","Order"], answer:1, cat:"Spring" },
{ text:"StringBuffer vs Builder?", options:["String mutable","Builder thread-safe","Buffer thread-safe","Same"], answer:2, cat:"Java" },
{ text:"Two args no return?", options:["BiFunction","BinaryOperator","BiConsumer","BiPredicate"], answer:2, cat:"Java" },

{ text:"String intern output?", options:["true true","false false","false true","true false"], answer:2, cat:"Code" },
{ text:"Static method call result?", options:["A","B","Compile error","Runtime error"], answer:0, cat:"Code" },
{ text:"Stream print result?", options:["12345","12","24","123"], answer:1, cat:"Code" },
{ text:"Finally return output?", options:["10","20","30","Error"], answer:1, cat:"Code" },
{ text:"Integer cache output?", options:["true true","false false","true false","false true"], answer:2, cat:"Code" },

{ text:"Thread start twice?", options:["Twice","Once","Once + Exception","Compile error"], answer:2, cat:"Code" },
{ text:"List remove in loop?", options:["[A,C]","[A,B,C]","ConcurrentModification","Index error"], answer:2, cat:"Code" },
{ text:"Overload null call?", options:["Obj","Str","Ambiguous","NPE"], answer:1, cat:"Code" },
{ text:"Enum constructor output?", options:["C","CC","No output","Error"], answer:1, cat:"Code" },
{ text:"Lambda effectively final?", options:["15","10","Compile error","5"], answer:0, cat:"Code" }

];

// ─────────────────────────── STATE ───────────────────────────
let userName = "";
let questions = [];    // shuffled questions with shuffled option indices
let currentIdx = 0;
let score = 0;
let answered = 0;
let wrongs = 0;

// ─────────────────────────── SHUFFLE ───────────────────────────
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuestions() {
  // Shuffle question order, then shuffle each question's options while tracking correct answer
  return shuffleArray(ALL_QUESTIONS).map(q => {
    // Create index array [0,1,2,3] and shuffle it
    const indices = shuffleArray([0, 1, 2, 3]);
    const shuffledOptions = indices.map(i => q.options[i]);
    // Find new position of correct answer
    const newCorrectIdx = indices.indexOf(q.answer);
    // Option letters A-D for display
    const letters = ["A", "B", "C", "D"];
    const displayLetters = indices.map((_,pos) => letters[pos]);
    return {
      text: q.text,
      cat: q.cat,
      options: shuffledOptions,
      correctIdx: newCorrectIdx,
      letters: ["A","B","C","D"]
    };
  });
}

// ─────────────────────────── SCREENS ───────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─────────────────────────── START ───────────────────────────
function startQuiz() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  userName = name;
  questions = prepareQuestions();
  currentIdx = 0; score = 0; answered = 0; wrongs = 0;
  showScreen('screen-quiz');
  renderQuestion();
}

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startQuiz();
});

// ─────────────────────────── RENDER QUESTION ───────────────────────────
function renderQuestion() {
  const q = questions[currentIdx];
  document.getElementById('qNum').textContent = currentIdx + 1;
  document.getElementById('progressFill').style.width = ((currentIdx / 40) * 100) + '%';
  document.getElementById('scoreDisplay').textContent = 'Score: ' + score;
  document.getElementById('qTag').textContent = q.cat;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';

  const optContainer = document.getElementById('options');
  optContainer.innerHTML = '';

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-letter">${q.letters[i]}</span><span class="opt-text">${opt}</span>`;
    btn.onclick = () => selectAnswer(i);
    optContainer.appendChild(btn);
  });
}

// ─────────────────────────── ANSWER ───────────────────────────
function selectAnswer(selectedIdx) {
  const q = questions[currentIdx];
  const opts = document.querySelectorAll('.opt');

  // Lock all options
  opts.forEach(o => o.classList.add('locked'));
  opts.forEach(o => o.onclick = null);

  const isCorrect = selectedIdx === q.correctIdx;
  opts[selectedIdx].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) opts[q.correctIdx].classList.add('correct');

  const fb = document.getElementById('feedback');
  if (isCorrect) {
    score++;
    answered++;
    fb.className = 'feedback correct-fb show';
    fb.innerHTML = '✓ Correct!';
  } else {
    answered++;
    wrongs++;
    fb.className = 'feedback wrong-fb show';
    fb.innerHTML = `✗ Incorrect. Correct answer: <strong>${q.letters[q.correctIdx]}) ${q.options[q.correctIdx]}</strong>`;
  }

  document.getElementById('scoreDisplay').textContent = 'Score: ' + score;
  document.getElementById('nextBtn').style.display = currentIdx < 39 ? 'inline-flex' : 'none';

  if (currentIdx === 39) {
    setTimeout(showResult, 900);
  }
}

// ─────────────────────────── NEXT ───────────────────────────
function nextQuestion() {
  currentIdx++;
  renderQuestion();
}

// ─────────────────────────── RESULT ───────────────────────────
function showResult() {
  showScreen('screen-result');
  const pct = Math.round((score / 40) * 100);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('statCorrect').textContent = score;
  document.getElementById('statWrong').textContent = wrongs;
  document.getElementById('statPct').textContent = pct + '%';

  const circle = document.getElementById('scoreCircle');
  circle.style.setProperty('--pct', pct);

  let title, sub;
  if (pct >= 90)      { title = "Outstanding! 🏆"; sub = "You aced this quiz. Incredible performance!"; }
  else if (pct >= 75) { title = "Great Work! 🌟"; sub = "Well above average. You know your stuff!"; }
  else if (pct >= 60) { title = "Good Job! 👍"; sub = "Solid performance. A bit more practice and you'll excel!"; }
  else if (pct >= 40) { title = "Keep Practicing 📚"; sub = "You're getting there. Review the topics you missed!"; }
  else                { title = "Don't Give Up! 💪"; sub = "Keep studying and try again. You'll improve!"; }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = `${userName}, you scored ${score} out of 40 (${pct}%)`;
  document.getElementById('saveNote').textContent = '';
}

// ─────────────────────────── SAVE SCORE ───────────────────────────
async function saveScore() {
  const note = document.getElementById('saveNote');
  note.className = 'save-note';
  note.textContent = 'Saving…';
  try {
    const res = await fetch('/save_score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: userName, score: score })
    });
    if (res.ok) {
      note.className = 'save-note ok';
      note.textContent = '✓ Score saved to server successfully!';
    } else {
      throw new Error('Server error ' + res.status);
    }
  } catch (e) {
    note.className = 'save-note err';
    note.textContent = '✗ Could not save: ' + e.message + '. Run the Python server to enable saving.';
  }
}

// ─────────────────────────── RETAKE ───────────────────────────
function retakeQuiz() {
  questions = prepareQuestions();
  currentIdx = 0; score = 0; answered = 0; wrongs = 0;
  showScreen('screen-quiz');
  renderQuestion();
}
</script>
</body>
</html>
